services:
  wavicle:
    build: .
    ports:
      - "6379:6379"
      - "8080:8080"
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - WAVICLE_STORAGE_ENGINE=postgres
      - WAVICLE_DB_TYPE=postgres
      - WAVICLE_DB_DSN=postgres://wavicle:wavicle@db:5432/wavicle?sslmode=disable
      - WAVICLE_METRICS_ENABLED=true
      - WAVICLE_AUTH_PASSWORD=testpass
      - WAVICLE_MAX_CONNS=20
    volumes:
      - wavicle-data:/var/lib/wavicle

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=wavicle
      - POSTGRES_PASSWORD=wavicle
      - POSTGRES_DB=wavicle
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "max_wal_senders=5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavicle -d wavicle"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  wavicle-data:
  postgres-data:
